 const mastered=!unresolved.length;
 const mins=Math.max(1,Math.round(run.ms/60000));
 const byType={};s.items.forEach(i=>{const r=run.res[i.id]||{};const b=byType[i.type]||(byType[i.type]={n:0,f:0});b.n++;if(r.first)b.f++});
 const opens=s.items.filter(i=>OPEN_TYPES.includes(i.type)&&run.res[i.id]&&run.res[i.id].scores);
 const missed=s.items.filter(i=>run.res[i.id]&&run.res[i.id].first===false);
 const gl=Object.keys(run.gl||{});
 const rec=qeRecommend(run),str=qeStrength(run,s,byType,opens),imp=qeImprove(run,s,opens);
 const outcome=mastered?'All '+total+' items are correct: '+first+' on the first try'+(afterRetry?' and '+afterRetry+' after retry':'')+'.'
  :m+' of '+total+' items are correct; '+unresolved.length+' still need review'+(skipped?' ('+skipped+' with the retry skipped)':'')+'.';
 const dOpen=qeWide()?' open':'';
 app.innerHTML='<div class="qe qe-sum"><div class="card" style="padding:22px"><div class="eyebrow">'+P.n+' · session complete</div><h1>'+esc(s.title)+'</h1>'+
  '<div class="qe-prog" role="progressbar" aria-label="Final progress" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+m+'" aria-valuetext="'+m+' of '+total+' mastered"><i style="width:'+Math.round(m/total*100)+'%"></i></div>'+
  '<p class="qe-outcome" id="qeOutcome" style="margin:10px 0 0;font-weight:600"><span class="tag '+(mastered?'acc':'xp')+'">'+(mastered?'Mastered':'Completed, not mastered')+'</span> '+esc(outcome)+'</p>'+
  '<div class="qe-take"><div><div class="eyebrow">Strength</div><p>'+esc(str)+'</p></div><div><div class="eyebrow">Improve next</div><p>'+esc(imp.text)+(imp.term?' <button type="button" class="gl" data-gl="'+imp.term+'">Define</button>':'')+(imp.guide?' <button type="button" class="link small" data-go="reads" data-arg="'+imp.guide+'">Read the guide</button>':'')+'</p></div></div>'+
  '<div class="qe-rec"><div class="eyebrow" style="color:var(--q-acc)">Recommended next practice</div><h3>'+esc(rec.title)+'</h3><p style="margin:0 0 10px">'+esc(rec.why)+'</p><button type="button" class="btn primary" id="qeRec">'+esc(rec.cta)+' '+IC.arrow+'</button></div>'+
  '<details class="qe-det qe-more"'+dOpen+'><summary>Detailed results</summary>'+
  '<div class="qe-stats"><div class="qe-stat"><div class="v">'+Math.round(first/total*100)+'%</div><div class="l">Right first try ('+first+' of '+total+')</div></div><div class="qe-stat"><div class="v">'+m+'/'+total+'</div><div class="l">Correct (mastered items)</div></div><div class="qe-stat"><div class="v">+'+run.xp+'</div><div class="l">XP earned</div></div><div class="qe-stat"><div class="v">'+(run.activeSec!=null?mmss(run.activeSec):mins+' min')+'</div><div class="l">Active time</div></div></div>'+
  '<h3 style="margin:14px 0 0">Each item</h3><ul class="qe-list" id="qeStates">'+s.items.map(i=>{const st=qeItemState(run,i.id);return '<li data-state="'+st.k+'"><span>'+esc(qeItemTitle(i))+'</span><span class="tag '+(st.k==='first'||st.k==='retry'?'acc':st.k==='none'?'':st.k==='att'||st.k==='skipped'?'xp':'bad')+'">'+st.l+'</span></li>'}).join('')+'</ul>'+
  (missed.length?'<h3 style="margin:14px 0 0">Missed concepts</h3><ul class="qe-list">'+missed.map(i=>{const st=qeItemState(run,i.id),g=TAG_GUIDE[i.tag];return '<li><span>'+(GL[i.tag]?'<button type="button" class="gl" data-gl="'+i.tag+'">'+esc(GL[i.tag].t)+'</button>':esc(i.tag))+'</span><span><span class="tag '+(st.k==='retry'?'acc':st.k==='skipped'?'xp':'bad')+'">'+st.l+'</span>'+(g&&GUIDES[g]?' <button type="button" class="link small" data-go="reads" data-arg="'+g+'">Read</button>':'')+'</span></li>'}).join('')+'</ul>':'')+
  '<h3 style="margin:14px 0 0">By question type</h3><ul class="qe-list">'+Object.entries(byType).map(([t,b])=>'<li><span>'+TYPE_LABEL[t]+'</span><span class="mono">'+b.f+' / '+b.n+' first try</span></li>').join('')+'</ul>'+
  (opens.length?'<h3 style="margin:14px 0 0">Rubric results</h3>'+opens.map(i=>{const r=run.res[i.id];return '<div class="dimr" style="padding:8px 0;border-top:1px solid var(--line)"><div class="spread"><strong>'+esc(plain(i.q))+'</strong><span class="mono">'+r.rubric+' / 12</span></div><div class="small muted">'+(r.revs>1?r.revs+' versions submitted. ':'1 version submitted. ')+(r.src==='ai'?'AI feedback.':'Demo feedback (not AI).')+'</div></div>'}).join(''):'')+
  (gl.length?'<h3 style="margin:14px 0 0">Glossary terms you looked up</h3><div class="topics">'+gl.map(k=>'<button type="button" class="gl" data-gl="'+k+'" style="margin-right:10px">'+esc(GL[k].t)+'</button>').join('')+'</div>':'')+
  '</details>'+
  '<div class="row" style="margin-top:14px">'+(unresolved.length?'<button type="button" class="btn" id="qeRetryMissed">'+QIC.retry+' Retry '+unresolved.length+' missed</button>':'')+'<button type="button" class="btn" id="qeAgain">Practice this set again</button><button type="button" class="btn" id="qeBack">Back to '+(qeBackArg(s)?'the guide':P.n)+'</button></div></div></div>';
 $('#qeRec').addEventListener('click',()=>{rec.qe?qeEnter(rec.qe,false):go(rec.go,rec.arg)});
 $('#qeAgain').addEventListener('click',()=>qeEnter(run.sid,true));
 $('#qeBack').addEventListener('click',()=>go(P.go,qeBackArg(s)));
 const rm=$('#qeRetryMissed');rm&&rm.addEventListener('click',()=>{run.done=false;run.stage='retry';run.queue=unresolved.map(i=>i.id);run.retry=[];run.pos=0;run.cur=null;run.tEnd=null;QE.iid=null;unresolved.forEach(i=>{if(run.res[i.id]){run.res[i.id].unresolved=false;run.res[i.id].skipped=false}});run.skipped=false;track('qe_retry_start',{sid:run.sid,n:unresolved.length,from:'summary'});save();render();window.scrollTo(0,0)});
 if(!run.logged){run.logged=1;save()}
}

/* ---------- HOME (v7): one recommendation, an honest resume row, quiet secondary links ---------- */
function homeWhy(k,id){
 const inPath=(START[S.start]||[]).some(y=>y[0]===k&&y[1]===id);
 return inPath?'Next step in your '+skillName(S.start)+' path.':'Next in the ProGylls sequence.';
}
function homeUnfinished(nx){
 if(qeActiveRun())return {type:'qe'};
 const part=Object.keys(DRILLS).find(k=>{const d=drillStats(k);return d.ans>0&&!d.done});
 if(part&&!(nx&&nx[0]==='drill'&&nx[1]===part))return {type:'drill',id:part};
 return null;
}
function viewHome(app){
 const today=xpOn(dayKey()),nx=nextUp(),first=!S.xp.length;
 const kindIc={read:IC.bars,drill:IC.timer,gym:IC.gym};
 let reco;
 if(nx){
  const [k,id]=nx,L=itemLabel(k,id),partial=k==='drill'&&drillStats(id).ans>0&&!drillStats(id).done;
  const time=k==='read'?GUIDES[id].min+' min read':k==='drill'?DRILLS[id].qs.length+' questions':GYM[id].format;
  const xp=k==='read'?'+10 XP':k==='drill'?'Up to +'+Math.round(25*MULT[DRILLS[id].level])+' XP':'+'+Math.round(50*MULT[GYM[id].level])+' XP or more';
  const verb=k==='read'?'Start reading':k==='drill'?(partial?'Resume drill':'Start drill'):'Start workout';
  reco='<section class="card lesson reco" aria-labelledby="recoT"><div class="eyebrow">Recommended next</div><div class="reco-main"><div class="tile" aria-hidden="true">'+kindIc[k]+'</div><div class="info"><span class="tag acc">'+L.kind+'</span><h2 id="recoT">'+esc(L.title)+'</h2><p class="muted">'+esc(itemDesc(k,id))+'</p><div class="meta"><span>'+IC.target+' '+esc(skillName(itemSkill(k,id)))+'</span><span>'+IC.clock+' '+esc(time)+'</span><span>'+IC.bolt+' '+esc(xp)+'</span></div></div></div><div class="reco-act"><button class="btn primary big" data-go="'+L.go+'" data-arg="'+id+'">'+verb+' '+IC.arrow+'</button><span class="why small muted">'+esc(homeWhy(k,id))+'</span><button type="button" class="link choose" data-go="practice">Choose something else</button></div></section>';
 }else reco='<section class="card lesson reco" aria-labelledby="recoT"><div class="reco-main"><div class="tile" aria-hidden="true">'+IC.check+'</div><div class="info"><h2 id="recoT">You have finished everything in the prototype</h2><p class="muted">Try a Gym challenge again to beat your score.</p></div></div><div class="reco-act"><button class="btn primary big" data-go="gym">Open Gym Room '+IC.arrow+'</button></div></section>';
 const head=nx?['Ready for your next PM challenge?','Practice real product problems. Strengthen your judgment.']:['Nice work','Redo a Gym workout to beat your score, or review your progress.'];
 const un=homeUnfinished(nx);let resume='';
 if(un&&un.type==='qe')resume=qeHomeResume();
 else if(un){const d=drillStats(un.id),s=DRILLS[un.id];resume=homeResumeRow({attrs:' data-go="drill" data-arg="'+un.id+'"',title:skillName(s.skill)+': '+s.title,sub:'Quick Drill · '+d.ans+' of '+d.total+' answered',pct:Math.round(d.ans/d.total*100),btn:'Resume'})}
 const fs=focusSkill();
 app.innerHTML='<section class="home-wel"><div><h1>'+head[0]+'</h1><p class="muted">'+head[1]+'</p></div>'+(first?'':'<div class="home-goal">'+miniRing(today,GOAL)+'<span><strong>'+today+'</strong> / '+GOAL+' XP today</span></div>')+'</section>'+reco+resume+
  (first?'':'<p class="home-focus small"><span class="muted">Skill focus:</span> <strong>'+esc(skillName(fs))+'</strong> · <button type="button" class="link" id="focusCard">See levels</button></p>'+'<p class="home-foot small muted"><strong>'+xpTotal()+' XP</strong> earned in total · <button type="button" class="link" data-go="progress">View progress</button></p>');
 const fc=$('#focusCard');fc&&fc.addEventListener('click',()=>skillSheet(fs));
}

/* ---------- PRACTICE hub (v8): one place for the three practice formats ---------- */
function viewPractice(app){
 const nx=nextUp(),rk=nx&&nx[0]!=='read'?nx[0]:null;
 const run=qeActiveRun(),runKind=run?(QSESS[run.sid].pillar==='gym'?'cases':'drill'):null;
 const nSets=Object.values(QSESS).filter(s=>s.pillar==='drill').length,nCases=Object.values(QSESS).filter(s=>s.pillar==='gym').length;
 const rows=[
  ['drill','Quick Drill','Short question sets with instant feedback. A quick way to test what you just read.',Object.keys(DRILLS).length+' drills · '+nSets+' mixed sets',IC.timer,'drill'],
  ['gym','Gym Room','Full workouts on real product problems: read the evidence, decide, then revise with feedback.','Choose workout type, time and difficulty',IC.gym,'gym'],
  ['cases','Case Simulations','Realistic multi-step cases. Diagnose, prioritise and write up your call.',nCases+' cases',IC.target,'gym']];
 app.innerHTML='<div class="hub-head"><h1>Practice</h1><p class="muted">Pick a format. Each one trains product judgment in a different way.</p></div>'+(run?qeHomeResume():'')+
  '<nav class="hub-list" aria-label="Practice formats">'+rows.map(r=>{const f=feat(r[5]),lk=f&&!isOpen(r[5]);
   return '<button type="button" class="hub-row'+(lk?' lk':'')+'" data-go="'+r[0]+'"><span class="tile" aria-hidden="true">'+r[4]+'</span><span class="mid"><strong>'+r[1]+(rk&&rk===r[0]?'<span class="tag acc">Recommended</span>':'')+(runKind===r[0]?'<span class="tag">In progress</span>':'')+(lk?'<span class="tag">'+IC.lock+' Locked</span>':'')+'</strong><span class="small muted">'+(lk?esc(f.hint):r[2])+'</span><span class="small muted">'+r[3]+'</span></span><span class="chev" aria-hidden="true">'+IC.chev+'</span></button>'}).join('')+'</nav>';
}

/* ---------- theme toggle (v8) ---------- */
const THEME_SVG={sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
function effectiveTheme(){const a=document.documentElement.getAttribute('data-theme');if(a==='light'||a==='dark')return a;return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
function paintThemeBtn(){const b=document.getElementById('themeBtn');if(!b)return;const d=effectiveTheme()==='dark';b.innerHTML=d?THEME_SVG.sun:THEME_SVG.moon;const l=d?'Switch to light theme':'Switch to dark theme';b.setAttribute('aria-label',l);b.title=l}
document.getElementById('themeBtn').addEventListener('click',()=>{const next=effectiveTheme()==='dark'?'light':'dark';const r=document.documentElement;r.classList.add('theme-anim');setTimeout(()=>r.classList.remove('theme-anim'),300);setTheme(next);toast(next==='dark'?'Dark theme on':'Light theme on');if(route.v==='settings')render()});
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paintThemeBtn)}catch(e){}
paintThemeBtn();

/* ---------- boot ---------- */
function fromHash(){const h=(location.hash||'').replace('#','').split('/');if(['home','reads','drill','gym','progress','settings','qe','cases','practice','tour'].includes(h[0]))route={v:h[0],a:h[1]||null}}
fromHash();render();
window.addEventListener('hashchange',()=>{const inRun=route.v==='qe'&&document.getElementById('qeExit'),nh=(location.hash||'').replace('#','').split('/');
 if(inRun&&!(nh[0]==='qe'&&nh[1]===route.a)){try{history.pushState(null,'','#qe/'+route.a)}catch(e){}qeExit();return}
 fromHash();render();window.scrollTo(0,0)});
</script>
